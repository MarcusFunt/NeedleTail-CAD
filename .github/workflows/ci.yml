name: CAD validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cad-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry-and-step:
    name: Geometry tests and STEP import checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Generate STEP exports
        run: |
          uv run --locked python airframe_oml.py --force
          uv run --locked python airframe.py --force
          uv run --locked python propeller_envelope.py --force
          uv run --locked python motor_prop_installation.py --force

      - name: Run geometry and STEP validation tests
        run: uv run --locked python -m unittest discover --verbose
