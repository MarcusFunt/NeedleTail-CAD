% Preliminary low-Mach, inviscid external-flow setup for the airframe OML.
% Coordinates are meters; positive X points toward the nose, so the cruise
% freestream enters from +X and travels in the -X direction.
SOLVER= INC_EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

MESH_FILENAME= airframe_domain.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= airframe_mesh_out

INC_DENSITY_INIT= 1.225
INC_VELOCITY_INIT= ( -15.0, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 288.15
INC_NONDIM= INITIAL_VALUES

MARKER_EULER= ( AIRFRAME )
MARKER_FAR= ( FARFIELD )
MARKER_PLOTTING= ( AIRFRAME )
MARKER_MONITORING= ( AIRFRAME )

REF_AREA= 0.0116
REF_LENGTH= 0.2
REF_ORIGIN_MOMENT_X= 0.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= FDS
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 1.0
ITER= 300

CONV_FILENAME= history
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
TABULAR_FORMAT= CSV
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )
OUTPUT_WRT_FREQ= 300
SCREEN_OUTPUT= ( INNER_ITER, WALL_TIME, RMS_RES, LIFT, DRAG )
